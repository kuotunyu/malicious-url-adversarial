[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urlguard"
version = "0.1.0"
description = "惡意網址偵測 + 對抗式攻防 (FGSM / PGD / 對抗訓練) 端到端 ML 專案"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kuotunyu" }]
keywords = ["adversarial-ml", "security", "phishing", "fgsm", "pgd", "tensorflow"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tensorflow==2.20.0",
    "kagglehub>=0.3",
    "typer>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
app = [
    "streamlit>=1.35",
]

[project.scripts]
urlguard = "urlguard.cli:app"

[project.urls]
Repository = "https://github.com/kuotunyu/malicious-url-adversarial"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urlguard = ["py.typed"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]  # 原始講座 notebook 刻意保留原貌，不納入 lint
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # line length handled by black/formatter

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
packages = ["urlguard"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
